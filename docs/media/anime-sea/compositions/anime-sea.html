<template>
  <style>#anime-sea{position:absolute;inset:0}#anime-sea-water{width:100%;height:100%;display:block}</style>
  <div id="anime-sea" data-composition-id="anime-sea" data-start="0" data-duration="24" data-width="1920" data-height="1080">
    <canvas id="anime-sea-water" class="clip" width="1920" height="1080" data-start="0" data-duration="24" data-track-index="1" data-layout-allow-overflow="full-bleed painted scenery"></canvas>
  </div>
  <script type="module">
    import {createSeaRenderer} from './renderer.mjs';
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady['anime-sea'] = (async () => {
      const draw = await createSeaRenderer(document.getElementById('anime-sea-water'), 'assets/master.png');
      const clock = {time: 0};
      const timeline = gsap.timeline({paused:true});
      timeline.fromTo(clock, {time:0}, {time:24,duration:24,ease:'none',onUpdate:()=>draw(clock.time)}, 0);
      window.addEventListener('hf-seek', event => draw(event.detail.time));
      draw(0);
      window.__timelines['anime-sea'] = timeline;
    })();
  </script>
</template>
